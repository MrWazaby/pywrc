# Dracula for pywrc — https://draculatheme.com/
#
# Copy this "[colors]" section into ~/.config/pywrc/pywrc.toml, where it wins over the
# colors of the WeeChat pywrc connects to. Colors are palette numbers, as they are in
# WeeChat: the comments name the color of the theme each one stands for. pywrc paints no
# background of its own, so the terminal is the one to be on the background #282a36.

[colors]
# the frame: separators and delimiters
separator = "238"                          # current line #44475a
chat_delimiters = "60"                     # comment #6272a4
chat_prefix_suffix = "238"                 # current line #44475a

# the chat
chat = "231"                               # foreground #f8f8f2
chat_time = "60"                           # comment #6272a4
chat_time_delimiters = "60"                # comment #6272a4
chat_buffer = "141"                        # purple #bd93f9
chat_server = "215"                        # orange #ffb86c
chat_channel = "141"                       # purple #bd93f9
chat_host = "116"                          # cyan #8be9fd
chat_value = "116"                         # cyan #8be9fd
chat_value_null = "60"                     # comment #6272a4
chat_tags = "203"                          # red #ff5555
chat_day_change = "116"                    # cyan #8be9fd
chat_read_marker = "141"                   # purple #bd93f9
chat_text_found = "228"                    # yellow #f1fa8c
chat_prefix_buffer = "215"                 # orange #ffb86c
chat_inactive_window = "60"                # comment #6272a4
chat_inactive_buffer = "60"                # comment #6272a4
chat_prefix_buffer_inactive_buffer = "60"  # comment #6272a4

# the prefixes of the lines
chat_prefix_error = "228"                  # yellow #f1fa8c
chat_prefix_network = "141"                # purple #bd93f9
chat_prefix_action = "141"                 # purple #bd93f9
chat_prefix_join = "84"                    # green #50fa7b
chat_prefix_quit = "203"                   # red #ff5555
chat_prefix_more = "212"                   # pink #ff79c6

# the nicks and the nicklist
chat_nick = "116"                          # cyan #8be9fd
chat_nick_self = "141"                     # purple #bd93f9
chat_nick_other = "116"                    # cyan #8be9fd
chat_nick_prefix = "84"                    # green #50fa7b
chat_nick_suffix = "84"                    # green #50fa7b
chat_nick_offline = "60"                   # comment #6272a4
chat_nick_offline_highlight = "231"        # foreground #f8f8f2
nicklist_group = "84"                      # green #50fa7b

# what is highlighted or searched for
chat_highlight = "235"                     # background #282a36
chat_highlight_bg = "212"                  # pink #ff79c6
emphasized = "228"                         # yellow #f1fa8c
emphasized_bg = "238"                      # current line #44475a

# the status bar
status_number = "228"                      # yellow #f1fa8c
status_name = "141"                        # purple #bd93f9
status_data_msg = "228"                    # yellow #f1fa8c
status_data_private = "84"                 # green #50fa7b
status_data_highlight = "212"              # pink #ff79c6
status_data_other = "231"                  # foreground #f8f8f2
status_count_msg = "215"                   # orange #ffb86c
status_count_private = "84"                # green #50fa7b
status_count_highlight = "141"             # purple #bd93f9
status_count_other = "231"                 # foreground #f8f8f2
status_more = "228"                        # yellow #f1fa8c
chat_status_enabled = "84"                 # green #50fa7b
chat_status_disabled = "203"               # red #ff5555
