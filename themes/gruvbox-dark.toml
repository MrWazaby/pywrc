# Gruvbox dark for pywrc — https://github.com/morhetz/gruvbox
#
# Copy this "[colors]" section into ~/.config/pywrc/pywrc.toml, where it wins over the
# colors of the WeeChat pywrc connects to. Colors are palette numbers, as they are in
# WeeChat: the comments name the color of the theme each one stands for. pywrc paints no
# background of its own, so the terminal is the one to be on dark0 #282828.
#
# The palette numbers are the ones gruvbox itself uses in a 256 color terminal.

[colors]
# the frame: separators and delimiters
separator = "239"                           # dark2 #504945
chat_delimiters = "243"                     # dark4 #7c6f64
chat_prefix_suffix = "239"                  # dark2 #504945

# the chat
chat = "223"                                # light1 #ebdbb2
chat_time = "245"                           # gray #928374
chat_time_delimiters = "243"                # dark4 #7c6f64
chat_buffer = "229"                         # light0 #fbf1c7
chat_server = "208"                         # bright orange #fe8019
chat_channel = "109"                        # bright blue #83a598
chat_host = "72"                            # neutral aqua #689d6a
chat_value = "108"                          # bright aqua #8ec07c
chat_value_null = "66"                      # neutral blue #458588
chat_tags = "124"                           # neutral red #cc241d
chat_day_change = "72"                      # neutral aqua #689d6a
chat_read_marker = "132"                    # neutral purple #b16286
chat_text_found = "214"                     # bright yellow #fabd2f
chat_prefix_buffer = "248"                  # light3 #bdae93
chat_inactive_window = "245"                # gray #928374
chat_inactive_buffer = "243"                # dark4 #7c6f64
chat_prefix_buffer_inactive_buffer = "243"  # dark4 #7c6f64

# the prefixes of the lines
chat_prefix_error = "214"                   # bright yellow #fabd2f
chat_prefix_network = "132"                 # neutral purple #b16286
chat_prefix_action = "229"                  # light0 #fbf1c7
chat_prefix_join = "142"                    # bright green #b8bb26
chat_prefix_quit = "167"                    # bright red #fb4934
chat_prefix_more = "175"                    # bright purple #d3869b

# the nicks and the nicklist
chat_nick = "108"                           # bright aqua #8ec07c
chat_nick_self = "229"                      # light0 #fbf1c7
chat_nick_other = "72"                      # neutral aqua #689d6a
chat_nick_prefix = "106"                    # neutral green #98971a
chat_nick_suffix = "106"                    # neutral green #98971a
chat_nick_offline = "243"                   # dark4 #7c6f64
chat_nick_offline_highlight = "223"         # light1 #ebdbb2
nicklist_group = "106"                      # neutral green #98971a

# what is highlighted or searched for
chat_highlight = "229"                      # light0 #fbf1c7
chat_highlight_bg = "124"                   # neutral red #cc241d
emphasized = "214"                          # bright yellow #fabd2f
emphasized_bg = "237"                       # dark1 #3c3836

# the status bar
status_number = "214"                       # bright yellow #fabd2f
status_name = "229"                         # light0 #fbf1c7
status_data_msg = "214"                     # bright yellow #fabd2f
status_data_private = "142"                 # bright green #b8bb26
status_data_highlight = "175"               # bright purple #d3869b
status_data_other = "223"                   # light1 #ebdbb2
status_count_msg = "208"                    # bright orange #fe8019
status_count_private = "106"                # neutral green #98971a
status_count_highlight = "132"              # neutral purple #b16286
status_count_other = "223"                  # light1 #ebdbb2
status_more = "214"                         # bright yellow #fabd2f
chat_status_enabled = "106"                 # neutral green #98971a
chat_status_disabled = "124"                # neutral red #cc241d
