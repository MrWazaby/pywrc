# Catppuccin Frappé for pywrc — https://github.com/catppuccin/catppuccin
#
# Copy this "[colors]" section into ~/.config/pywrc/pywrc.toml, where it wins over the
# colors of the WeeChat pywrc connects to. Colors are palette numbers, as they are in
# WeeChat: the comments name the color of the theme each one stands for. pywrc paints no
# background of its own, so the terminal is the one to be on base #303446.

[colors]
# the frame: separators and delimiters
separator = "60"                            # surface1 #51576d
chat_delimiters = "103"                     # overlay1 #838ba7
chat_prefix_suffix = "60"                   # surface1 #51576d

# the chat
chat = "189"                                # text #c6d0f5
chat_time = "146"                           # subtext0 #a5adce
chat_time_delimiters = "103"                # overlay1 #838ba7
chat_buffer = "224"                         # rosewater #f2d5cf
chat_server = "216"                         # peach #ef9f76
chat_channel = "111"                        # blue #8caaee
chat_host = "116"                           # teal #81c8be
chat_value = "152"                          # sky #99d1db
chat_value_null = "117"                     # sapphire #85c1dc
chat_tags = "174"                           # maroon #ea999c
chat_day_change = "116"                     # teal #81c8be
chat_read_marker = "183"                    # mauve #ca9ee6
chat_text_found = "223"                     # yellow #e5c890
chat_prefix_buffer = "181"                  # flamingo #eebebe
chat_inactive_window = "146"                # subtext0 #a5adce
chat_inactive_buffer = "103"                # overlay1 #838ba7
chat_prefix_buffer_inactive_buffer = "103"  # overlay1 #838ba7

# the prefixes of the lines
chat_prefix_error = "223"                   # yellow #e5c890
chat_prefix_network = "183"                 # mauve #ca9ee6
chat_prefix_action = "224"                  # rosewater #f2d5cf
chat_prefix_join = "150"                    # green #a6d189
chat_prefix_quit = "174"                    # red #e78284
chat_prefix_more = "218"                    # pink #f4b8e4

# the nicks and the nicklist
chat_nick = "152"                           # sky #99d1db
chat_nick_self = "224"                      # rosewater #f2d5cf
chat_nick_other = "116"                     # teal #81c8be
chat_nick_prefix = "150"                    # green #a6d189
chat_nick_suffix = "150"                    # green #a6d189
chat_nick_offline = "103"                   # overlay1 #838ba7
chat_nick_offline_highlight = "189"         # text #c6d0f5
nicklist_group = "150"                      # green #a6d189

# what is highlighted or searched for
chat_highlight = "236"                      # base #303446
chat_highlight_bg = "174"                   # red #e78284
emphasized = "223"                          # yellow #e5c890
emphasized_bg = "238"                       # surface0 #414559

# the status bar
status_number = "223"                       # yellow #e5c890
status_name = "224"                         # rosewater #f2d5cf
status_data_msg = "223"                     # yellow #e5c890
status_data_private = "150"                 # green #a6d189
status_data_highlight = "218"               # pink #f4b8e4
status_data_other = "189"                   # text #c6d0f5
status_count_msg = "216"                    # peach #ef9f76
status_count_private = "150"                # green #a6d189
status_count_highlight = "183"              # mauve #ca9ee6
status_count_other = "189"                  # text #c6d0f5
status_more = "223"                         # yellow #e5c890
chat_status_enabled = "150"                 # green #a6d189
chat_status_disabled = "174"                # maroon #ea999c
