[project]
name = "pywrc"
version = "0.3.0"
description = "A WeeChat relay client for the terminal, in the spirit of vanilla WeeChat"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alexandre Martin" }]
requires-python = ">=3.11"
dependencies = ["textual>=0.86"]
keywords = ["weechat", "relay", "irc", "tui", "textual"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat :: Internet Relay Chat",
]

[project.scripts]
pywrc = "pywrc.__main__:main"

[project.urls]
Homepage = "https://github.com/MrWazaby/pywrc"

[tool.hatch.build.targets.wheel]
packages = ["src/pywrc"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["commitizen>=3.29", "pre-commit>=3.8", "pytest>=8.3", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
