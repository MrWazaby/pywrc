[project]
name = "gwrc"
version = "0.1.0"
description = "A WeeChat relay client for the terminal, in the spirit of vanilla WeeChat"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alexandre Martin" }]
requires-python = ">=3.11"
dependencies = ["textual>=0.86"]

[project.scripts]
gwrc = "gwrc.__main__:main"

[project.urls]
Homepage = "https://github.com/MrWazaby/gwrc"

[tool.hatch.build.targets.wheel]
packages = ["src/gwrc"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["commitizen>=3.29", "pre-commit>=3.8", "pytest>=8.3", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true

[tool.pytest.ini_options]
testpaths = ["tests"]
